<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUSU</title>
<style>
  :root {
    --bg-deep: #0b1410; --bg-mid: #142620; --bg-panel: #1b3129;
    --ink: #eaf4ee; --ink-dim: #8fae9d; --gold: #f1c40f; --ok: #6ee7a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #234639 0%, transparent 55%),
      radial-gradient(ellipse at 85% 105%, #1d3a2e 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-deep), var(--bg-mid) 60%, var(--bg-deep));
    color: var(--ink); font-family: -apple-system, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 14px; text-align: center;
  }
  h1.title {
    font-family: Georgia, 'Times New Roman', serif; font-weight: 800; letter-spacing: 0.16em;
    font-size: clamp(2.2rem, 9vw, 3.4rem); margin: 6px 0 4px;
    background: linear-gradient(120deg, var(--gold), #ff9d5c 45%, var(--ok));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { color: var(--ink-dim); font-size: 0.95rem; margin-bottom: 40px; }

  .mode-cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
  .mode-card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px; padding: 28px 26px; width: 260px;
    text-decoration: none; color: var(--ink);
    transition: transform 0.2s ease, border-color 0.2s ease;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .mode-card:hover { transform: translateY(-6px); border-color: var(--gold); }
  .mode-card .emoji { font-size: 2.6rem; }
  .mode-card h2 { font-family: Georgia, serif; font-size: 1.2rem; margin: 4px 0; letter-spacing: 0.04em; }
  .mode-card p { color: var(--ink-dim); font-size: 0.85rem; line-height: 1.5; margin: 0; }
  .mode-card .cta {
    margin-top: 8px; padding: 9px 20px; border-radius: 999px;
    background: linear-gradient(120deg, var(--gold), #ff9d5c);
    color: #241300; font-weight: 800; font-size: 0.85rem;
  }

  footer { margin-top: 44px; color: var(--ink-dim); font-size: 0.75rem; opacity: 0.7; }
</style>
</head>
<body>
  <h1 class="title">PUSU</h1>
  <div class="subtitle">Gizli tuzak, 5 cephe, taktik savaş</div>

  <div class="mode-cards">
    <a class="mode-card" href="/ai">
      <div class="emoji">🤖</div>
      <h2>TEK OYUNCULU</h2>
      <p>Yapay zekaya karşı hemen oyna. Kayıt yok, oda kodu yok.</p>
      <div class="cta">OYNA</div>
    </a>
    <a class="mode-card" href="/online">
      <div class="emoji">👥</div>
      <h2>ONLINE</h2>
      <p>Oda kur, kodu arkadaşına gönder, gerçek zamanlı savaşın.</p>
      <div class="cta">ODA KUR / KATIL</div>
    </a>
  </div>

  <footer>PUSU — taktik kart/tahta oyunu</footer>
</body>
</html>
